[workspace]
resolver = "3"
members = [
    "crates/phalanx-vm",
    "crates/phalanx-lang",
    "crates/phalanx-sim",
    "crates/phalanx-tourney",
    "crates/phalanx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Phalanx Contributors"]
description = "Sandboxed autonomous bot battle arena with custom typed language, bytecode verifier, zero-alloc register VM, and deterministic fixed-point physics."

[workspace.dependencies]
phalanx-vm = { path = "crates/phalanx-vm" }
phalanx-lang = { path = "crates/phalanx-lang" }
phalanx-sim = { path = "crates/phalanx-sim" }
phalanx-tourney = { path = "crates/phalanx-tourney" }
proptest = "1.5"
criterion = "0.5"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
