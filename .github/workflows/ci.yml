name: Phalanx CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit, Property & Integration Tests
        run: cargo test --workspace

      - name: Zero-Allocation VM Proof
        run: cargo test -p phalanx-vm --test zero_alloc

      - name: End-to-End CLI & Determinism Smoke
        run: |
          cargo run --release -- compile bots/kiter.phx --verify-report
          cargo run --release -- watch --headless --seed 42 --save-replay target/ci_demo.phxr
          cargo run --release -- replay target/ci_demo.phxr --verify --headless
          cargo run --release -- tourney --rounds 5 --audit-determinism
